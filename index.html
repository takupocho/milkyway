<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>世界座標レイマーチ 計測試作</title>
<style>
  :root{ color-scheme:dark; }
  *{box-sizing:border-box;}
  body{
    margin:0;padding:10px;background:#0b0e1a;color:#e8ecf8;
    font:13px/1.5 'Inter','Noto Sans JP',system-ui,sans-serif;
  }
  h1{font-size:15px;margin:0 0 8px;letter-spacing:.02em;}
  .note{color:#9aa4c8;font-size:11px;margin:0 0 10px;}
  canvas{
    width:100%;height:auto;display:block;border:1px solid #2a3050;border-radius:8px;background:#05070f;
  }
  .panel{
    margin-top:10px;padding:10px;border:1px solid #2a3050;border-radius:8px;background:rgba(18,22,42,.7);
  }
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;}
  .row:last-child{margin-bottom:0;}
  label{font-size:11px;color:#9aa4c8;min-width:64px;}
  button{
    padding:7px 11px;border-radius:8px;border:1px solid #4a5590;background:#1a2040;color:#e8ecf8;
    font:600 12px/1 'Inter',sans-serif;cursor:pointer;
  }
  button.on{border-color:#f2ad55;color:#f2ad55;}
  button:disabled{opacity:.45;}
  input[type=range]{flex:1;min-width:120px;}
  #stats{
    margin-top:10px;padding:10px;border:1px solid #2a3050;border-radius:8px;background:#070a16;
    font:12px/1.7 'IBM Plex Mono',ui-monospace,monospace;white-space:pre-wrap;color:#cfe2ff;
  }
  .big{color:#f2ad55;font-size:15px;font-weight:700;}
  .warn{color:#ff9a9a;}
</style>
</head>
<body>
<h1>世界座標レイマーチ ― 計測用の試作</h1>
<p class="note">
  地形をカメラ基準の極座標ではなく、<b>世界に固定した標高タイル</b>として持ち、
  画面の列ごとに世界座標を進みながら可視面を決める方式の速度を測ります。
  移動しても地形データの作り直しは起きません（タイルはカメラに依存しないため）。
  本番用ではなく、数字を取るためだけの使い捨てです。
</p>

<canvas id="view" width="600" height="372"></canvas>

<div class="panel">
  <div class="row">
    <label>場所</label>
    <button data-place="33.927994,136.147394,0">熊野（海岸）</button>
    <button data-place="35.496351,138.607987,0">精進湖</button>
    <button data-place="35.507224,138.823678,0">富士吉田</button>
  </div>
  <div class="row">
    <label>光線の本数</label>
    <button data-cols="400">400</button>
    <button data-cols="600" class="on">600</button>
    <button data-cols="900">900</button>
  </div>
  <div class="row">
    <label>歩幅</label>
    <button data-growth="1.05">粗い</button>
    <button data-growth="1.03" class="on">標準</button>
    <button data-growth="1.015">細かい</button>
  </div>
  <div class="row">
    <label>高度 <span id="altLabel">44m</span></label>
    <input id="alt" type="range" min="0" max="150" value="44">
  </div>
  <div class="row">
    <label>方位 <span id="azLabel">0°</span></label>
    <input id="az" type="range" min="0" max="359" value="0">
  </div>
  <div class="row">
    <button id="fly">自動飛行を開始</button>
    <button id="once">1フレームだけ描く</button>
  </div>
</div>

<div id="stats">準備中…</div>

<script>
(()=>{
"use strict";
const D2R=Math.PI/180, R2D=180/Math.PI, EARTH_R=6371000*(7/6); // 大気差込みの地球半径

/* =========================================================
   1. 標高タイル（世界座標）
   国土地理院 dem_png を256×256のFloat32へ展開して保持する。
   近距離用(z14 ≒ 8m/px)と遠距離用(z11 ≒ 63m/px)の2段を持ち、
   距離で使い分ける。タイルはカメラに依存しないので、
   観測地点が動いてもこの配列は作り直さない。
   ========================================================= */
const TILE=256;
function lonToPixelX(lon,z){ return (lon+180)/360*TILE*Math.pow(2,z); }
function latToPixelY(lat,z){
  const s=Math.sin(lat*D2R);
  return (0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*TILE*Math.pow(2,z);
}
function decodeDem(imageData){
  const d=imageData.data, out=new Float32Array(TILE*TILE);
  for(let i=0,p=0;i<out.length;i++,p+=4){
    const x=d[p]*65536+d[p+1]*256+d[p+2];
    // 0x800000 は「標高データなし」＝海など。NaNで持つ。
    out[i]=(x===8388608)?NaN:(x<8388608?x*0.01:(x-16777216)*0.01);
  }
  return out;
}
function loadTile(z,x,y){
  return new Promise(resolve=>{
    const img=new Image();
    img.crossOrigin="anonymous";
    img.onload=()=>{
      const c=document.createElement("canvas");c.width=TILE;c.height=TILE;
      const cx=c.getContext("2d",{willReadFrequently:true});
      cx.drawImage(img,0,0);
      try{ resolve(decodeDem(cx.getImageData(0,0,TILE,TILE))); }
      catch(e){ resolve(null); }
    };
    img.onerror=()=>resolve(null);
    img.src=`https://cyberjapandata.gsi.go.jp/xyz/dem_png/${z}/${x}/${y}.png`;
  });
}
/* ある倍率のタイル群。緯度経度を渡すと、双一次補間した標高を返す。 */
function createField(z){
  const tiles=new Map();
  return {
    z, tiles,
    async load(lat,lon,radiusTiles){
      const cx=Math.floor(lonToPixelX(lon,z)/TILE), cy=Math.floor(latToPixelY(lat,z)/TILE);
      const jobs=[];
      for(let dy=-radiusTiles;dy<=radiusTiles;dy++){
        for(let dx=-radiusTiles;dx<=radiusTiles;dx++){
          const tx=cx+dx, ty=cy+dy, key=`${tx}/${ty}`;
          if(tiles.has(key)) continue;
          tiles.set(key,null);
          jobs.push(loadTile(z,tx,ty).then(data=>tiles.set(key,data)));
        }
      }
      await Promise.all(jobs);
      return jobs.length;
    },
    /* 双一次補間。データが無ければ NaN（＝海または未取得）。 */
    at(lat,lon){
      const px=lonToPixelX(lon,z), py=latToPixelY(lat,z);
      const x0=Math.floor(px), y0=Math.floor(py);
      const fx=px-x0, fy=py-y0;
      let sum=0,weight=0;
      for(let j=0;j<2;j++){
        for(let i=0;i<2;i++){
          const gx=x0+i, gy=y0+j;
          const t=tiles.get(`${Math.floor(gx/TILE)}/${Math.floor(gy/TILE)}`);
          if(!t) continue;
          const v=t[((gy%TILE)+TILE)%TILE*TILE+(((gx%TILE)+TILE)%TILE)];
          if(!Number.isFinite(v)) continue;
          const w=(i?fx:1-fx)*(j?fy:1-fy);
          sum+=v*w; weight+=w;
        }
      }
      return weight>0.4?sum/weight:NaN;
    }
  };
}
const nearField=createField(14);  // 約8m/px
const farField=createField(11);   // 約63m/px

/* =========================================================
   2. 水域ラスタ（世界座標）
   OSMの水域ポリゴンを、近距離タイルと同じ格子へ一度だけ塗る。
   カメラが動いても塗り直さないので、岸の位置が動くたびに
   量子化し直される今の作りと違い、境界が飛ばない。
   ========================================================= */
const WATER_GRID=512;            // 観測地点まわり WATER_SPAN_M 四方を這わせる格子
const WATER_SPAN_M=6000;
let waterMask=null, waterOrigin=null, waterMs=0, waterFetchMs=0, waterRings=0;
function metresPerDegLon(lat){ return 111320*Math.cos(lat*D2R); }
async function buildWaterMask(lat,lon){
  const tFetch=performance.now();
  waterOrigin={lat,lon};
  waterMask=new Uint8Array(WATER_GRID*WATER_GRID);
  let rings=[];
  try{
    const radius=Math.round(WATER_SPAN_M*0.75);
    const query=`[out:json][timeout:30];(way["natural"="water"](around:${radius},${lat},${lon});`+
      `relation["natural"="water"](around:${radius},${lat},${lon}););out geom;`;
    // 応答が遅いことがあるので必ず打ち切る。水域が取れなくても計測は続ける。
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),8000);
    const res=await fetch("https://overpass.kumi.systems/api/interpreter",{
      method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},
      body:"data="+encodeURIComponent(query),signal:controller.signal
    }).finally(()=>clearTimeout(timer));
    const json=await res.json();
    (json.elements||[]).forEach(elem=>{
      if(Array.isArray(elem.geometry)) rings.push(elem.geometry.map(p=>[p.lat,p.lon]));
      else if(Array.isArray(elem.members)) elem.members.forEach(m=>{
        if(m.role!=="outer"||!Array.isArray(m.geometry)) return;
        rings.push(m.geometry.map(p=>[p.lat,p.lon]));
      });
    });
  }catch(e){ rings=[]; }
  waterFetchMs=performance.now()-tFetch;   // 通信待ち。塗る時間とは分けて測る。
  const t0=performance.now();
  waterRings=rings.length;
  // 緯度経度 → 格子座標
  const mLon=metresPerDegLon(lat), half=WATER_SPAN_M/2, scale=WATER_GRID/WATER_SPAN_M;
  const toGrid=(pLat,pLon)=>[((pLon-lon)*mLon+half)*scale, (half-(pLat-lat)*111320)*scale];
  // 走査線塗りつぶし。1回だけの処理なので素直な実装で十分。
  for(const ring of rings){
    if(ring.length<3) continue;
    const pts=ring.map(p=>toGrid(p[0],p[1]));
    let minY=Infinity,maxY=-Infinity;
    for(const p of pts){ if(p[1]<minY)minY=p[1]; if(p[1]>maxY)maxY=p[1]; }
    const y1=Math.max(0,Math.floor(minY)), y2=Math.min(WATER_GRID-1,Math.ceil(maxY));
    for(let y=y1;y<=y2;y++){
      const cy=y+0.5, xs=[];
      for(let i=0,j=pts.length-1;i<pts.length;j=i++){
        const a=pts[j], b=pts[i];
        if((a[1]>cy)===(b[1]>cy)) continue;
        xs.push(a[0]+(cy-a[1])/(b[1]-a[1])*(b[0]-a[0]));
      }
      xs.sort((p,q)=>p-q);
      for(let k=0;k+1<xs.length;k+=2){
        const sx=Math.max(0,Math.ceil(xs[k]-0.5)), ex=Math.min(WATER_GRID-1,Math.floor(xs[k+1]-0.5));
        for(let x=sx;x<=ex;x++) waterMask[y*WATER_GRID+x]=1;
      }
    }
  }
  waterMs=performance.now()-t0;
}
function waterAt(lat,lon){
  if(!waterMask||!waterOrigin) return false;
  const mLon=metresPerDegLon(waterOrigin.lat), half=WATER_SPAN_M/2, scale=WATER_GRID/WATER_SPAN_M;
  const gx=Math.floor(((lon-waterOrigin.lon)*mLon+half)*scale);
  const gy=Math.floor((half-(lat-waterOrigin.lat)*111320)*scale);
  if(gx<0||gy<0||gx>=WATER_GRID||gy>=WATER_GRID) return false;
  return waterMask[gy*WATER_GRID+gx]===1;
}

/* =========================================================
   3. レイマーチ描画
   画面の列ごとに1本の光線を世界座標へ飛ばし、手前から奥へ
   歩きながら「見かけ高度の最大値」を更新する。更新された分だけ
   縦に塗るので、隙間は原理的に出ない（帯を並べる必要がない）。
   ========================================================= */
const view=document.getElementById("view");
const vctx=view.getContext("2d");
let imageData=null, pixels=null;
let columns=600, growth=1.03;
const MAX_DIST=25000, MIN_STEP=4;

function resizeCanvas(){
  view.width=columns;
  view.height=Math.round(columns*0.62);
  imageData=vctx.createImageData(view.width,view.height);
  pixels=new Uint32Array(imageData.data.buffer);
}
function rgb(r,g,b){ return (255<<24)|(b<<16)|(g<<8)|r; }
function mix(a,b,t){ return a+(b-a)*t; }

const camera={lat:33.927994,lon:136.147394,az:0,pitch:-8,fovH:74,rise:44};
let lastSamples=0;

function renderFrame(){
  const W=view.width, H=view.height;
  const tanHalfH=Math.tan(camera.fovH/2*D2R);
  const tanHalfV=tanHalfH*(H/W);
  const groundHere=nearField.at(camera.lat,camera.lon);
  const eyeElev=(Number.isFinite(groundHere)?groundHere:0)+1.6+camera.rise;
  const mLat=111320, mLon=metresPerDegLon(camera.lat);
  const pitchTan=Math.tan(camera.pitch*D2R);
  let samples=0;

  // 空
  for(let y=0;y<H;y++){
    const t=y/H, c=rgb(Math.round(mix(78,150,t)),Math.round(mix(112,175,t)),Math.round(mix(178,205,t)));
    pixels.fill(c,y*W,(y+1)*W);
  }

  for(let col=0;col<W;col++){
    // 中心投影。列の位置から光線の方位を出す。
    const xNorm=((col+0.5)/W-0.5)*2*tanHalfH;
    const azRad=camera.az*D2R+Math.atan(xNorm);
    const sinAz=Math.sin(azRad), cosAz=Math.cos(azRad);
    const cosSpread=1/Math.sqrt(1+xNorm*xNorm); // 斜め方向の見かけ高度の補正
    let runMax=-Math.PI/2, yPrev=H;
    let d=MIN_STEP, step=MIN_STEP*0.6;
    while(d<MAX_DIST){
      const east=sinAz*d, north=cosAz*d;
      const pLat=camera.lat+north/mLat, pLon=camera.lon+east/mLon;
      const field=d<3000?nearField:farField;
      let elev=field.at(pLat,pLon);
      samples++;
      const isSea=!Number.isFinite(elev);
      if(isSea) elev=0;
      const water=isSea||(d<WATER_SPAN_M*0.5&&waterAt(pLat,pLon));
      const drop=d*d/(2*EARTH_R);
      const alt=Math.atan2(elev-eyeElev-drop,d);
      if(alt>runMax){
        // 画面座標へ。垂直は中心投影のまま扱う。
        const yTop=Math.round(H/2-(Math.tan(alt)*cosSpread-pitchTan)/tanHalfV*(H/2));
        const y0=Math.max(0,yTop), y1=Math.min(H,yPrev);
        if(y1>y0){
          const haze=Math.min(1,d/22000);
          let r,g,b;
          if(water){ r=mix(58,150,haze); g=mix(96,172,haze); b=mix(158,200,haze); }
          else{
            const high=Math.min(1,Math.max(0,elev/900));
            r=mix(mix(74,128,high),150,haze);
            g=mix(mix(112,132,high),172,haze);
            b=mix(mix(58,120,high),198,haze);
          }
          const c=rgb(Math.round(r),Math.round(g),Math.round(b));
          for(let y=y0;y<y1;y++) pixels[y*W+col]=c;
        }
        if(yTop<=0){ runMax=alt; break; } // 画面上端を超えたらこの列は終わり
        yPrev=Math.min(yPrev,yTop);
        runMax=alt;
      }
      step=Math.max(MIN_STEP,step*growth);
      d+=step;
    }
  }
  lastSamples=samples;
  vctx.putImageData(imageData,0,0);
}

/* =========================================================
   4. 計測
   ========================================================= */
const statsEl=document.getElementById("stats");
let tileMs=0, tileCount=0, frames=[], flying=false, flyRaf=0, lastFly=0;
function median(a){ if(!a.length) return 0; const s=[...a].sort((x,y)=>x-y); return s[s.length>>1]; }
function showStats(extra=""){
  const m=median(frames), mn=frames.length?Math.min(...frames):0, mx=frames.length?Math.max(...frames):0;
  statsEl.innerHTML=
    `<span class="big">1フレーム 中央値 ${m.toFixed(1)}ms（${m?(1000/m).toFixed(0):0}fps）</span>\n`+
    `最短 ${mn.toFixed(1)}ms ／ 最長 ${mx.toFixed(1)}ms ／ 計測 ${frames.length}枚\n`+
    `光線 ${columns}本 × 平均 ${lastSamples&&columns?Math.round(lastSamples/columns):0}歩 = ${lastSamples.toLocaleString()}サンプル/フレーム\n`+
    `\n`+
    `標高タイル: ${tileCount}枚 取得+展開 ${tileMs.toFixed(0)}ms（起動時に1回だけ）\n`+
    `水域ポリゴン取得: ${waterFetchMs.toFixed(0)}ms（通信。失敗しても計測は続行）
`+
    `水域ラスタ化: ${waterRings}形状 → ${WATER_GRID}×${WATER_GRID}格子 ${waterMs.toFixed(1)}ms（1回だけ）
`+
    `移動時の地形再構築: 0ms（タイルはカメラに依存しないため作り直さない）\n`+
    (extra?`\n${extra}`:"");
}
function measureOnce(){
  const t0=performance.now();
  renderFrame();
  const ms=performance.now()-t0;
  frames.push(ms);
  if(frames.length>120) frames.shift();
  return ms;
}

async function setPlace(lat,lon){
  flying=false; cancelAnimationFrame(flyRaf); document.getElementById("fly").textContent="自動飛行を開始";
  document.getElementById("fly").classList.remove("on");
  camera.lat=lat; camera.lon=lon;
  frames=[];
  statsEl.textContent="標高タイルを取得中…";
  const t0=performance.now();
  const n1=await nearField.load(lat,lon,2);   // z14 を5×5＝約10km四方
  const n2=await farField.load(lat,lon,1);    // z11 を3×3＝約48km四方
  tileMs=performance.now()-t0; tileCount=n1+n2;
  statsEl.textContent="水域データを取得中…";
  await buildWaterMask(lat,lon);
  measureOnce();
  showStats("※ 1回目は他の処理と重なるため、自動飛行での中央値を見てください。");
}

function flyLoop(now){
  if(!flying) return;
  const dt=Math.min(.1,(now-lastFly)/1000); lastFly=now;
  // 前進しながらゆっくり旋回する。地形の作り直しが無いことを体感するための動き。
  const speed=25;
  const mLat=111320, mLon=metresPerDegLon(camera.lat);
  camera.lat+=Math.cos(camera.az*D2R)*speed*dt/mLat;
  camera.lon+=Math.sin(camera.az*D2R)*speed*dt/mLon;
  camera.az=(camera.az+6*dt)%360;
  document.getElementById("az").value=Math.round(camera.az);
  document.getElementById("azLabel").textContent=Math.round(camera.az)+"°";
  measureOnce();
  showStats();
  flyRaf=requestAnimationFrame(flyLoop);
}

document.querySelectorAll("[data-place]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const [lat,lon]=btn.dataset.place.split(",").map(Number);
    document.querySelectorAll("[data-place]").forEach(b=>b.classList.remove("on"));
    btn.classList.add("on");
    setPlace(lat,lon);
  });
});
document.querySelectorAll("[data-cols]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll("[data-cols]").forEach(b=>b.classList.remove("on"));
    btn.classList.add("on");
    columns=+btn.dataset.cols; resizeCanvas(); frames=[]; measureOnce(); showStats();
  });
});
document.querySelectorAll("[data-growth]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll("[data-growth]").forEach(b=>b.classList.remove("on"));
    btn.classList.add("on");
    growth=+btn.dataset.growth; frames=[]; measureOnce(); showStats();
  });
});
document.getElementById("alt").addEventListener("input",e=>{
  camera.rise=+e.target.value;
  document.getElementById("altLabel").textContent=camera.rise+"m";
  if(!flying){ measureOnce(); showStats(); }
});
document.getElementById("az").addEventListener("input",e=>{
  camera.az=+e.target.value;
  document.getElementById("azLabel").textContent=camera.az+"°";
  if(!flying){ measureOnce(); showStats(); }
});
document.getElementById("once").addEventListener("click",()=>{ measureOnce(); showStats(); });
document.getElementById("fly").addEventListener("click",e=>{
  flying=!flying;
  e.target.textContent=flying?"自動飛行を停止":"自動飛行を開始";
  e.target.classList.toggle("on",flying);
  if(flying){ frames=[]; lastFly=performance.now(); flyRaf=requestAnimationFrame(flyLoop); }
  else cancelAnimationFrame(flyRaf);
});

resizeCanvas();
document.querySelector("[data-place]").classList.add("on");
setPlace(camera.lat,camera.lon);
})();
</script>
</body>
</html>
